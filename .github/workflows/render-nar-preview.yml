name: Render Nar silent video preview

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Nar-Preview.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Nar
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering tools and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip pillow

      - name: Render 1080p montage
        run: python make_preview.py

      - name: Publish preview back to Nar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nar-Preview.mp4
          if git diff --cached --quiet; then
            echo "No changes in preview output."
            exit 0
          fi
          git commit -m "Build silent 1080p screenshot montage preview"
          git push
